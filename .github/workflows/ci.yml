name: Flutter, Dart, Worker and security CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      git_smoke:
        description: Also test the example against its committed Git dependency
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Test the checked-out package source
        run: |
          printf 'dependency_overrides:\n  bachs_flutter:\n    path: ..\n' > pubspec_overrides.yaml
          flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Remove local override
        if: always()
        run: rm -f pubspec_overrides.yaml
  example-git-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.git_smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Use Flutter's bundled Dart to prevent formatter version drift.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bin
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: |
          mkdir -p build
          dart compile exe bin/server.dart -o build/bachs-server
          dart compile exe bin/example_merchant_backend.dart -o build/example-merchant-backend
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=low
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: python3 tool/security_check.py secrets
      - run: python3 tool/security_check.py osv
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
