name: bachs_checkout_example
description: Sandbox shopping app using the public Bachs Flutter Git dependency.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  bachs_flutter:
    git:
      url: https://github.com/j-kon/bachs_flutter.git
      ref: main
    version: 0.3.0
  app_links: ^7.2.2
dev_dependencies:
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
